[project]
name = "team12-tester"
version = "0.1.0"
description = "Team 12 cross-team tester for the ECE 30861 Excel accessibility hub (Phase 3)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic>=2",
    "pydantic-settings>=2",
    "uvicorn",
]

[dependency-groups]
dev = [
    "openpyxl",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
