services:
  - type: web
    name: workbook-service
    runtime: docker
    branch: Gustavo
    plan: free
    region: ohio
    healthCheckPath: /api/v1/health
    autoDeployTrigger: off
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workbook-database
          property: connectionString
      - key: API_TOKENS_JSON
        sync: false

databases:
  - name: workbook-database
    plan: free
    region: ohio
    databaseName: workbooks
    user: workbook_user
    ipAllowList: []
