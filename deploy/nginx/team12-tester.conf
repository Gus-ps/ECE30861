# nginx: serve the tester at https://<host>/tester. Add these locations inside the host's
# existing HTTPS server block (certificate from e.g. certbot); the system can share the host
# under its own prefix such as /system.

location = /tester {
    return 308 /tester/;
}

location /tester/ {
    # The trailing slash strips /tester before forwarding; uvicorn runs with --root-path /tester.
    proxy_pass http://127.0.0.1:8001/;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A run waits for the whole suite (600 s budget); nginx's 60 s default would cut it off.
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;

    # Operator requests are small JSON bodies.
    client_max_body_size 64k;
}
