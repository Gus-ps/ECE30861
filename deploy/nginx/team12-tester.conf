# nginx: serve the tester at the root of its own subdomain.
# Team 12: https://tester.13.184.14.226.sslip.io (sslip.io resolves every subdomain to the IP it
# embeds, so the tester shares a host with the system at https://13.184.14.226.sslip.io, which
# keeps its own server block). Replace tester.<host> with the tester's DNS name and point the
# certificate paths at a certificate for that name (e.g. certbot --nginx -d tester.<host>).
# The tester runs with an empty ROOT_PATH (no --root-path): nothing is stripped.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tester.<host>;

    ssl_certificate     /etc/letsencrypt/live/tester.<host>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tester.<host>/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8001;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A run waits for the whole suite: up to 2,400 s (Phase 5 budget) plus the tester's 30 s
        # guard, so 2,430 s (spec 3.0.0 §12 minimum); 30 s more of headroom. nginx's 60 s default
        # would cut it off.
        proxy_read_timeout 2460s;
        proxy_send_timeout 2460s;

        # Operator requests are small JSON bodies.
        client_max_body_size 64k;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name tester.<host>;
    return 308 https://$host$request_uri;
}

# Alternative: a path prefix on a shared server block (https://<host>/tester). Use these two
# locations inside that block instead of the servers above, and run the tester with
# ROOT_PATH=/tester (systemd: --root-path /tester). The trailing slash on proxy_pass strips
# /tester before forwarding; keep the same timeouts and body limit.
#
#   location = /tester { return 308 /tester/; }
#   location /tester/ {
#       proxy_pass http://127.0.0.1:8001/;
#       ...
#   }
